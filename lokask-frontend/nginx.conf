# 1. HTTP to HTTPS Redirect Block
server {
    listen 80;
    server_name lokask.se www.lokask.se;
    
    return 301 https://$host$request_uri;
}

# 2. Primary Secure HTTPS Block
server {
    listen 443 ssl;
    server_name lokask.se www.lokask.se;
   
    client_max_body_size 20M;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/lokask.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lokask.se/privkey.pem;

    # frontend
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # proxy
    location /api/v1/media{
        rewrite ^/api/v1/media/(.*)$ /$1 break;

        proxy_pass https://deun1-general-purpose-bucket.s3.eu-north-1.amazonaws.com;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # backend
    location /api/ {
        proxy_pass http://backend:8080; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme; 
    }

    # websocket
    location /ws/ {
        proxy_pass http://backend:8080;
        
        # Mandatory WebSocket Upgrade Headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme; 
        
        # Keep WebRTC alive during long video calls
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    
    # static assets (React build files)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4|webm)$ {
        root /usr/share/nginx/html;
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}
