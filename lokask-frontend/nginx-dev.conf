server {
    listen 80;
    
    # 1. FRONTEND: Serve React
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. BACKEND API: Proxy to Go container
    location /api/ {
        client_max_body_size 20M;
        # 'backend' must match the service name in docker-compose.yml
        proxy_pass http://backend:8080; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }


    # 3. WEBSOCKETS: Proxy WebRTC Signaling to Go
    location /ws/ {
        proxy_pass http://backend:8080;
        
        # 🟢 Mandatory WebSocket Upgrade Headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        
        # Keep WebRTC alive during long video calls
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Optional: Cache static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4|webm)$ {
        root /usr/share/nginx/html;
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}
