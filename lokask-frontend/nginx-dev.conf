server {
    listen 80;
    
    # 1. FRONTEND: Serve React
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. BACKEND API: Proxy to Go container
    location /api/ {
        client_max_body_size 20M;
        # 'backend' must match the service name in docker-compose.yml
        proxy_pass http://backend:8080; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # handler CORS
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, PATCH, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
    
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, PATCH, DELETE';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }


    # 3. WEBSOCKETS: Proxy WebRTC Signaling to Go
    location /ws/ {
        proxy_pass http://backend:8080;
        
        # 🟢 Mandatory WebSocket Upgrade Headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        
        # Keep WebRTC alive during long video calls
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 4. 🟢 MINIO S3 API: Proxy Object Storage
    # Catches any request starting with your bucket names
    location ~ ^/(user-avatars|galleries|covers)/ {
        client_max_body_size 20M; 
        
        # 'minio' must match the service name in docker-compose.yml
        # 9000 is the standard MinIO API port (9001 is for the console)
        proxy_pass http://minio:9000; 
        
        # MinIO strictly requires the original host header
        proxy_set_header Host $http_host; 
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 🟢 MinIO CORS (Prevents canvas/image manipulation blocking in React)
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
    }

    # Optional: Cache static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4|webm)$ {
        root /usr/share/nginx/html;
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}
