# 1. HTTP to HTTPS Redirect Block
server {
    listen 80;
    server_name 54-198-81-188.nip.io;
    
    # Force all unencrypted traffic over to port 443
    return 301 https://$host$request_uri;
}

# 2. Primary Secure HTTPS Block
server {
    listen 443 ssl;
    server_name 54-198-81-188.nip.io;

    # 🟢 SSL Certificates (Must be mounted via docker-compose)
    ssl_certificate /etc/letsencrypt/live/54-198-81-188.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/54-198-81-188.nip.io/privkey.pem;

    # 1. FRONTEND: Serve React
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. BACKEND API: Proxy to Go container
    location /api/ {
        proxy_pass http://backend:8080; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme; # Tells Go this is HTTPS
    }

    # 3. WEBSOCKETS: Proxy WebRTC Signaling to Go
    location /ws/ {
        proxy_pass http://backend:8080;
        
        # Mandatory WebSocket Upgrade Headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme; # Tells Go this is WSS
        
        # Keep WebRTC alive during long video calls
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 4. Optional: Cache static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4|webm)$ {
        root /usr/share/nginx/html;
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}