services:
  # 1. Spatial Database (PostgreSQL + PostGIS)
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: lokask_db
    restart: on-failure
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: lokask_cache
    restart: on-failure
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 2. Backend image
  backend:
    image: huyhoangph99/lokask-repository:backend-latest
    container_name: lokask_api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      MAIL_SERVER: ${MAIL_SERVER}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_API_KEY: ${MAIL_API_KEY}
      REDIS_ADDR: "redis:6379"
      # AWS configuration (Keys are handled by EC2 Instance Profile!)
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_S3_AVATAR_BUCKET: ${AWS_S3_AVATAR_BUCKET}
      AWS_S3_MEDIA_BUCKET: ${AWS_S3_MEDIA_BUCKET}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE}
  
  frontend:
    image: huyhoangph99/lokask-repository:frontend-buildcache-latest
    container_name: lokask_web
    restart: on-failure
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /home/lokask-service/ssl-cert:/etc/letsencrypt:ro

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: travel_net