services:
  # 1. Spatial Database (PostgreSQL + PostGIS)
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: lokask_db
    restart: on-failure
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mounts our SQL script to auto-create tables on first startup
      # TODO: create start-up script
      - ./infra/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # 2. Object Storage (S3 Compatible for Images)
  minio:
    image: minio/minio:latest
    container_name: lokask_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9000:9000" # API Port (Go connects here)
      - "9001:9001" # Console Port (You login here via Browser)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: lokask_cache
    restart: on-failure
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 2.5. Backend image
  backend:
    build: ./backend # Points to the folder containing your Go code
    container_name: lokask_api_dev
    depends_on:
      db:
        condition: service_healthy   # Wait for PostGIS to be ready
      redis:
        condition: service_healthy
    ports:
      - "8080:8080" # Maps your machine's 8080 to container's 8080
    environment:
      # Networking: Inside Docker, we use service names (postgres, minio)
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      MINIO_ACCESS_KEY: ${MINIO_USER}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD}
      MINIO_USE_SSL: "false"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_PUBLIC_URL: "http://localhost"
      REDIS_ADDR: "redis:6379"
  
  frontend:
    build: 
      context: ../lokask-frontend
      dockerfile: ../lokask-frontend/dev.Dockerfile
    container_name: lokask_web_dev
    restart: on-failure
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  minio_data:
  redis_data:

networks:
  default:
    name: travel_net
